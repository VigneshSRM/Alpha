# Local stack: MariaDB + the portal.
#   docker compose up --build
#   → http://localhost:8080/login
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: alpha_portal
      MARIADB_USER: alpha
      MARIADB_PASSWORD: ${DB_PASSWORD:-alpha}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mariadb://db:3306/alpha_portal
      DB_USERNAME: alpha
      DB_PASSWORD: ${DB_PASSWORD:-alpha}
      SECRET_KEY: ${SECRET_KEY:-please-override-this-in-production-with-a-long-random-value}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      APP_NAME: Alpha Group of India
    ports:
      - "8080:8080"

volumes:
  mariadb-data:
