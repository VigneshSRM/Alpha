<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create account · ' + ${appName})}"></head>

<body class="page page--auth page--signup" th:attr="data-policy=${policyJson}">

<th:block th:replace="~{fragments :: scene}"></th:block>

<main class="stage">
  <div class="stage__col">
    <section class="access" aria-labelledby="signupHeading">
      <a class="access__brand" th:href="@{/login}" th:attr="aria-label=${appName}">
        <img th:src="@{/img/alpha-logo-light.png(v=${assetV})}" th:alt="${appName}"
             width="1200" height="472">
      </a>

      <h1 id="signupHeading">Create your account</h1>
      <p class="access__sub">Your details are verified by the server, not the browser.</p>

      <div class="flash flash--error" role="alert" data-flash th:hidden="${error == null}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/>
        </svg>
        <span data-flash-text th:text="${error}"></span>
      </div>

      <div class="flash flash--success" role="status" data-success hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>
        </svg>
        <span data-success-text>Account created. Taking you to your dashboard…</span>
      </div>

      <form class="form" id="authForm" method="post" action="/signup"
            novalidate autocomplete="on" data-mode="signup"
            data-check-endpoint="/api/password-check">
        <input type="hidden" name="csrf_token" th:value="${_csrf.token}">

        <div class="field" data-field="name">
          <label class="field__label" for="name">Full name</label>
          <div class="control">
            <span class="control__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>
              </svg>
            </span>
            <input class="control__input" id="name" name="name" type="text"
                   autocomplete="name" placeholder="Your full name" maxlength="80" required
                   th:value="${form['name']}" aria-describedby="nameError">
          </div>
          <p class="field__error" id="nameError" role="alert" th:text="${errors['name']}"></p>
        </div>

        <div class="field" data-field="email">
          <label class="field__label" for="email">Work e-mail</label>
          <div class="control">
            <span class="control__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7.5 8 5.5 8-5.5"/>
              </svg>
            </span>
            <input class="control__input" id="email" name="email" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" placeholder="name@alphagroup.in"
                   maxlength="254" required th:value="${form['email']}" aria-describedby="emailError">
          </div>
          <p class="field__error" id="emailError" role="alert" th:text="${errors['email']}"></p>
        </div>

        <div class="field" data-field="phone">
          <label class="field__label" for="phone">Mobile number</label>
          <div class="control control--split">
            <span class="control__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>
              </svg>
            </span>
            <select class="control__select" id="country_code" name="country_code"
                    aria-label="Country dialling code">
              <option th:each="c : ${countries}"
                      th:value="${c.iso}"
                      th:text="${c.dialCode} + ' ' + ${c.name}"
                      th:attr="data-digits=${c.minDigits + '-' + c.maxDigits}"
                      th:selected="${c.iso == form['country']}">+91 India</option>
            </select>
            <input class="control__input" id="phone" name="phone" type="tel" inputmode="tel"
                   autocomplete="tel-national" spellcheck="false" placeholder="98765 43210"
                   maxlength="20" required th:value="${form['phone']}"
                   aria-describedby="phoneHint phoneError">
          </div>
          <p class="field__hint" id="phoneHint" data-phone-hint>10 digits for the selected country</p>
          <p class="field__error" id="phoneError" role="alert" th:text="${errors['phone']}"></p>
        </div>

        <div class="field" data-field="password">
          <div class="field__top">
            <label class="field__label" for="password">Password</label>
            <th:block th:replace="~{fragments :: hintIcon}"></th:block>
          </div>

          <div class="control">
            <span class="control__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
                <path d="M12 14v2.5"/>
              </svg>
            </span>
            <input class="control__input control__input--password" id="password" name="password"
                   type="password" autocomplete="new-password" placeholder="Create a strong password"
                   maxlength="128" required aria-describedby="passwordError capsLock" enterkeyhint="next">
            <button class="control__action" type="button" id="togglePassword"
                    aria-label="Show password" aria-pressed="false" title="Show password">
              <th:block th:replace="~{fragments :: eyeIcons}"></th:block>
            </button>
          </div>

          <p class="hint hint--caps" id="capsLock" hidden>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4 5 11h4v4h6v-4h4Z"/><path d="M8 20h8"/>
            </svg>
            Caps Lock is on
          </p>
          <p class="field__error" id="passwordError" role="alert" th:text="${errors['password']}"></p>

          <th:block th:replace="~{fragments :: policyPopover(suggest=true)}"></th:block>
        </div>

        <div class="field" data-field="confirm_password">
          <label class="field__label" for="confirm_password">Confirm password</label>
          <div class="control">
            <span class="control__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/>
                <path d="m9.5 15 1.8 1.8 3.2-3.4"/>
              </svg>
            </span>
            <input class="control__input" id="confirm_password" name="confirm_password" type="password"
                   autocomplete="new-password" placeholder="Repeat your password" maxlength="128" required
                   aria-describedby="confirmError">
            <button class="control__action" type="button" id="toggleConfirm"
                    aria-label="Show confirmation password" aria-pressed="false" title="Show password">
              <th:block th:replace="~{fragments :: eyeIcons}"></th:block>
            </button>
          </div>
          <p class="field__error" id="confirmError" role="alert" th:text="${errors['confirm_password']}"></p>
        </div>

        <button class="btn btn--primary" type="submit" id="submitBtn">
          <span class="btn__label">Create account</span>
          <span class="btn__spinner" aria-hidden="true"></span>
          <svg class="btn__arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h13"/><path d="m12.5 5.5 6.5 6.5-6.5 6.5"/>
          </svg>
        </button>

        <p class="form__alt">
          Already registered? <a class="link" th:href="@{/login}">Sign in</a>
        </p>
      </form>
    </section>
  </div>
</main>

<th:block th:replace="~{fragments :: footer}"></th:block>

<script th:src="@{/js/auth.js(v=${assetV})}" defer></script>
</body>
</html>
