<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Choose your modules · ' + ${appName})}"></head>

<body class="page page--modules">

<main class="mods">
  <a class="mods__brand" th:href="@{/dashboard}">
    <img th:src="@{/img/alpha-logo-light.png(v=${assetV})}" th:alt="${appName}"
         width="1200" height="472">
  </a>

  <header class="mods__head">
    <p class="mods__step">Step 3 of 3</p>
    <h1>Choose your modules</h1>
    <p class="mods__sub">
      Switch on what the business needs today. Everything here can be added or
      removed later from Settings.
    </p>
  </header>

  <form class="mods__form" id="modulesForm" method="post" th:action="@{/modules}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <p class="onb__alert" role="alert" th:if="${error}" th:text="${error}">
      Choose at least one module.
    </p>

    <ul class="module-grid" data-module-grid>
      <li th:each="module : ${modules}">
        <label class="module">
          <input type="checkbox" name="modules" th:value="${module.code}"
                 th:checked="${#lists.contains(selected, module.code)}">
          <span class="module__mark" aria-hidden="true"
                th:text="${#strings.toUpperCase(#strings.substring(module.name, 0, 1))}">P</span>
          <span class="module__body">
            <span class="module__name" th:text="${module.name}">POS</span>
            <span class="module__blurb" th:text="${module.blurb}">Bill at the counter.</span>
          </span>
          <span class="module__tick" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                 stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </span>
        </label>
      </li>
    </ul>

    <div class="mods__actions">
      <p class="mods__count" aria-live="polite">
        <span data-chosen-count>0</span> of <span data-total-count>10</span> chosen
      </p>
      <button class="btn btn--primary" id="modulesSubmit" type="submit">
        <span class="btn__label">Continue</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h13"/><path d="m12 5 7 7-7 7"/>
        </svg>
      </button>
    </div>
  </form>

</main>

<th:block th:replace="~{fragments :: footer}"></th:block>

<script th:src="@{/js/modules.js(v=${assetV})}" defer></script>
</body>
</html>
