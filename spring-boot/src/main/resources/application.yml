server:
  port: ${PORT:8080}
  # Behind a reverse proxy (Render, Fly, nginx) so X-Forwarded-* is honoured.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: Alpha Group Portal
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  # Default: assets come from the jar (populated at build time from ../app/static).
  # The `dev` profile serves them straight from disk instead.
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          no-cache: true

alpha:
  app-name: ${APP_NAME:Alpha Group of India}
  provider-name: Supabase
  support-email: ${SUPPORT_EMAIL:help@alphagroup.in}

  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    # Service-role key is intentionally NOT used: this app never bypasses RLS.
    timeout-seconds: 15

  security:
    token-refresh-skew-seconds: 60
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-window-seconds: ${LOGIN_WINDOW_SECONDS:900}
    remember-me-days: 14

logging:
  level:
    in.alphagroup.portal: INFO
