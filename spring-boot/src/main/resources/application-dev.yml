# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Serves the CSS/JS/images straight out of ../app/static, so editing a stylesheet
# in the Python project is picked up here on refresh — one copy, two apps.
spring:
  thymeleaf:
    cache: false
  web:
    resources:
      static-locations: file:../app/static/,classpath:/static/

logging:
  level:
    in.alphagroup.portal: DEBUG
