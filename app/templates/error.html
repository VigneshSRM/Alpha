{% extends "base.html" %}
{% block title %}{{ code }} · {{ app_name }}{% endblock %}
{% block body_class %}page page--auth{% endblock %}

{% block content %}
<div class="backdrop" aria-hidden="true">
  <span class="backdrop__orb backdrop__orb--gold"></span>
  <span class="backdrop__orb backdrop__orb--ember"></span>
  <span class="backdrop__grid"></span>
</div>

<main class="shell shell--narrow">
  <section class="card card--single">
    <div class="panel panel--center">
      <img class="panel__logo panel__logo--center" src="{{ url_for('static', filename='img/alpha-logo.png') }}"
           alt="{{ app_name }}" width="1997" height="787">
      <p class="error-code">{{ code }}</p>
      <h1>{{ message }}</h1>
      <p class="panel__sub">If this keeps happening, contact the Alpha Group IT desk.</p>
      <a class="btn btn--primary" href="{{ url_for('auth.login') }}">Back to sign in</a>
    </div>
  </section>
</main>
{% endblock %}
